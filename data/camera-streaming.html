<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>视流 · 摄像信号推流</title>
<style>
/* ───────────────────────── tokens ───────────────────────── */
:root {
  --bg:        oklch(16% 0.02 245);
  --surface:   oklch(21% 0.02 245);
  --surface-2: oklch(26% 0.02 245);
  --fg:        oklch(96% 0.005 250);
  --muted:     oklch(66% 0.02 240);
  --border:    oklch(31% 0.02 240);

  --accent:    oklch(72% 0.17 150);
  --danger:    oklch(64% 0.20 25);

  --accent-soft: color-mix(in oklch, var(--accent) 16%, transparent);

  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Cascadia Code', ui-monospace, Menlo, Consolas, monospace;

  --radius: 14px;
  --radius-lg: 22px;
}

/* ───────────────────────── base ───────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(120% 90% at 50% 0%, oklch(20% 0.02 245), oklch(12% 0.02 250) 70%);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font: inherit; cursor: pointer; color: inherit; background: none; border: none; padding: 0; }
p, h1, h2 { margin: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }

/* ───────────────────────── stage ───────────────────────── */
.stage {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

/* ───────────────────────── phone ───────────────────────── */
.phone {
  position: relative;
  width: 392px;
  max-width: 100%;
  height: min(820px, calc(100vh - 48px));
  min-height: 600px;
  background: var(--bg);
  border: 1px solid oklch(100% 0 0 / 0.08);
  border-radius: 46px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow:
    0 0 0 10px oklch(9% 0.01 245),
    0 0 0 11px oklch(100% 0 0 / 0.06),
    0 30px 80px -20px oklch(0% 0 0 / 0.7);
}
.island {
  position: absolute;
  top: 10px; left: 50%;
  transform: translateX(-50%);
  width: 108px; height: 28px;
  background: oklch(5% 0.01 250);
  border-radius: 999px;
  z-index: 30;
}
.statusbar {
  height: 44px;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 26px;
  font-family: var(--font-mono);
  font-size: 12px;
}

/* ───────────────────────── app header ───────────────────────── */
.apphead {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 20px 12px;
}
.brand { display: flex; align-items: center; gap: 9px; }
.brand .mark {
  width: 28px; height: 28px;
  border-radius: 8px;
  display: grid; place-items: center;
  background: var(--accent-soft);
  color: var(--accent);
}
.brand .mark svg { width: 16px; height: 16px; }
.brand .name { font-size: 15px; font-weight: 600; }
.device-pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-mono); font-size: 11px;
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 6px 11px;
}
.device-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

/* ───────────────────────── viewport ───────────────────────── */
.viewport {
  position: relative;
  flex: 1;
  margin: 0 14px;
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: oklch(9% 0.01 250);
  border: 1px solid oklch(100% 0 0 / 0.07);
}
.scene {
  position: absolute; inset: 0;
  background:
    radial-gradient(90% 46% at 76% 16%, oklch(82% 0.06 90 / 0.5), transparent 60%),
    radial-gradient(70% 50% at 22% 88%, oklch(30% 0.04 55 / 0.85), transparent 70%),
    linear-gradient(180deg, oklch(32% 0.035 65), oklch(21% 0.025 55) 55%, oklch(13% 0.015 45));
  transition: background 0.4s ease, transform 0.4s ease;
}
.scene.front {
  background:
    radial-gradient(90% 46% at 72% 18%, oklch(78% 0.045 220 / 0.5), transparent 60%),
    radial-gradient(70% 50% at 24% 88%, oklch(31% 0.03 235 / 0.85), transparent 70%),
    linear-gradient(180deg, oklch(34% 0.03 235), oklch(21% 0.025 240) 58%, oklch(14% 0.02 250));
  transform: scaleX(-1);
}
.scene::after {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(130% 130% at 50% 46%, transparent 52%, oklch(0% 0 0 / 0.6) 100%);
}

.hud-top {
  position: absolute; top: 12px; left: 12px; right: 12px;
  display: flex; justify-content: space-between;
  pointer-events: none;
}
.badge {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg);
  background: oklch(8% 0.01 250 / 0.55);
  backdrop-filter: blur(8px);
  border: 1px solid oklch(100% 0 0 / 0.12);
  border-radius: 999px;
  padding: 5px 10px;
}
.live-pill {
  position: absolute; top: 12px; left: 50%;
  transform: translateX(-50%);
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-mono);
  font-size: 11px; letter-spacing: 0.1em;
  color: var(--fg);
  background: oklch(0% 0 0 / 0.45);
  backdrop-filter: blur(8px);
  border-radius: 999px;
  padding: 5px 11px;
  pointer-events: none;
}
.live-pill .rec {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--danger);
  animation: pulse 1.6s infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 oklch(64% 0.2 25 / 0.55); }
  70% { box-shadow: 0 0 0 7px oklch(64% 0.2 25 / 0); }
  100% { box-shadow: 0 0 0 0 oklch(64% 0.2 25 / 0); }
}

/* ───────────────────────── dock ───────────────────────── */
.dock {
  flex: none;
  padding: 14px 16px 22px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.ctl-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ctl {
  display: flex; flex-direction: column; gap: 7px;
  padding: 12px 13px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  text-align: left;
  transition: border-color 0.15s ease;
}
.ctl:hover { border-color: oklch(50% 0.02 240); }
.ctl .lbl { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.ctl .lbl svg { width: 14px; height: 14px; }
.ctl .val {
  font-family: var(--font-mono); font-size: 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
}
.ctl .val .chev { color: var(--muted); }
.ctl .switch-cam { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

/* 密码字段 */
.field { display: flex; flex-direction: column; gap: 7px; }
.field label { font-size: 11px; color: var(--muted); }
.inputwrap { position: relative; }
.inputwrap input {
  width: 100%;
  padding: 12px 44px 12px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--fg);
  font-family: var(--font-mono);
  font-size: 14px;
  transition: border-color 0.15s ease;
}
.inputwrap input:focus { border-color: var(--accent); }
.inputwrap .eye {
  position: absolute; right: 6px; top: 50%;
  transform: translateY(-50%);
  width: 34px; height: 34px;
  display: grid; place-items: center;
  color: var(--muted);
  border-radius: 8px;
}
.inputwrap .eye:hover { color: var(--fg); }
.inputwrap .eye svg { width: 18px; height: 18px; }
.field .field-hint { font-size: 11px; color: var(--muted); }

/* 按钮 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%;
  min-height: 48px;
  padding: 13px 18px;
  border-radius: var(--radius);
  font-size: 15px; font-weight: 600;
  transition: background 0.15s ease, opacity 0.15s ease, transform 0.05s ease;
}
.btn:active { transform: translateY(1px); }
.btn-primary {
  background: var(--accent);
  color: oklch(15% 0.02 150);
}
.btn-primary:hover { background: oklch(76% 0.17 150); }
.btn-danger {
  background: var(--danger);
  color: oklch(97% 0.005 25);
}
.btn-danger:hover { background: oklch(69% 0.20 25); }
.btn[disabled] { opacity: 0.55; cursor: not-allowed; }
.btn .spin {
  width: 16px; height: 16px;
  border: 2px solid oklch(15% 0.02 150 / 0.35);
  border-top-color: oklch(15% 0.02 150);
  border-radius: 50%;
  animation: rot 0.8s linear infinite;
}
@keyframes rot { to { transform: rotate(360deg); } }

/* ───────────────────────── 信号卡片 ───────────────────────── */
.sig-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 13px;
  display: flex; flex-direction: column; gap: 9px;
}
.sig-card .sig-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sig-card .proto { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; color: var(--muted); }
.sig-card .proto .ptag {
  color: var(--accent);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 2px 6px;
  letter-spacing: 0.02em;
  margin-right: 6px;
}
.sig-card .url {
  font-family: var(--font-mono); font-size: 12px;
  color: var(--fg);
  word-break: break-all;
  line-height: 1.5;
}
.copy-btn {
  flex: none;
  display: inline-flex; align-items: center; gap: 5px;
  min-height: 34px;
  padding: 6px 11px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: var(--font-mono); font-size: 11px;
  color: var(--fg);
  transition: border-color 0.15s ease, color 0.15s ease;
}
.copy-btn:hover { border-color: var(--accent); color: var(--accent); }
.copy-btn.copied { color: var(--accent); border-color: var(--accent); }

.auth-note {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 13px;
  background: var(--accent-soft);
  border: 1px solid color-mix(in oklch, var(--accent) 30%, transparent);
  border-radius: var(--radius);
  font-size: 12px;
}
.auth-note svg { width: 15px; height: 15px; color: var(--accent); flex: none; }
.auth-note .pwd { font-family: var(--font-mono); color: var(--muted); }

/* ───────────────────────── 分辨率 sheet ───────────────────────── */
.scrim {
  position: fixed; inset: 0;
  background: oklch(0% 0 0 / 0.55);
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease;
  z-index: 40;
}
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 50%; bottom: 0;
  transform: translate(-50%, 100%);
  width: min(420px, 100%);
  background: var(--surface);
  border: 1px solid var(--border);
  border-bottom: none;
  border-radius: 26px 26px 0 0;
  padding: 10px 16px 26px;
  z-index: 50;
  transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
}
.sheet.open { transform: translate(-50%, 0); }
.sheet .grab { width: 40px; height: 4px; border-radius: 999px; background: var(--border); margin: 4px auto 14px; }
.sheet h2 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
.sheet .sheet-sub { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
.res-list { display: flex; flex-direction: column; gap: 8px; }
.res-item {
  display: flex; align-items: center; gap: 12px;
  width: 100%;
  text-align: left;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 13px 14px;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.res-item:hover { border-color: oklch(50% 0.02 240); }
.res-item.selected { border-color: var(--accent); background: var(--accent-soft); }
.res-item .ri-main { flex: 1; }
.res-item .ri-res { font-family: var(--font-mono); font-size: 14px; }
.res-item .ri-meta { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-top: 2px; }
.res-item .ri-check {
  width: 20px; height: 20px; flex: none;
  border-radius: 50%;
  border: 1px solid var(--border);
  display: grid; place-items: center;
  color: transparent;
}
.res-item.selected .ri-check {
  border-color: var(--accent);
  background: var(--accent);
  color: oklch(15% 0.02 150);
}
.res-item .ri-check svg { width: 12px; height: 12px; }

/* ───────────────────────── toast ───────────────────────── */
.toast {
  position: fixed; left: 50%; bottom: 30px;
  transform: translate(-50%, 20px);
  background: var(--fg);
  color: var(--bg);
  font-family: var(--font-mono); font-size: 13px;
  padding: 11px 18px;
  border-radius: 999px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
  z-index: 60;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ───────────────────────── responsive ───────────────────────── */
@media (max-width: 520px) {
  .stage { padding: 0; }
  .phone {
    width: 100%;
    height: 100vh;
    border: none;
    border-radius: 0;
    box-shadow: none;
  }
  .statusbar { padding: 0 20px; }
  .island { display: none; }
}
@media (max-height: 700px) {
  .phone { height: 100vh; }
}
</style>
</head>
<body>
<div class="stage">
  <div class="phone" role="application" aria-label="视流推流应用">
    <div class="island"></div>

    <div class="statusbar">
      <span class="mono" id="clock">14:32</span>
      <span class="sb-right" style="display:flex; gap:6px; align-items:center;">
        <svg viewBox="0 0 16 12" width="16" height="12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="2.5" height="12" rx="1"/></svg>
        <svg viewBox="0 0 16 12" width="16" height="12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 9.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/><path d="M2.5 5a7.7 7.7 0 0 1 11 0M5 7.5a4.2 4.2 0 0 1 6 0" stroke-linecap="round"/></svg>
      </span>
    </div>

    <header class="apphead">
      <div class="brand">
        <span class="mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-2.5h6L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.4"/></svg>
        </span>
        <div class="name">视流</div>
      </div>
      <span class="device-pill"><span class="dot"></span>双摄 · 已连接</span>
    </header>

    <section class="viewport" data-od-id="camera-view" aria-label="相机预览">
      <div class="scene" id="scene"></div>
      <div class="hud-top">
        <span class="badge" id="camBadge">后置 · 广角</span>
        <span class="badge" id="resBadge">1080P · 30fps</span>
      </div>
      <div class="live-pill" id="livePill" hidden><span class="rec"></span>LIVE <span class="mono" id="timer">00:00:00</span></div>
    </section>

    <section class="dock" data-od-id="stream-controls">
      <div id="preControls">
        <div class="ctl-row">
          <button class="ctl" id="camSwitch" type="button" data-od-id="camera-switch">
            <span class="lbl">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-2.5h6L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.2"/></svg>
              当前镜头
            </span>
            <span class="val"><span id="camSwitchLabel">后置</span><span class="switch-cam">切换 ↺</span></span>
          </button>
          <button class="ctl" id="resSelector" type="button" data-od-id="resolution-selector">
            <span class="lbl">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M7 5v4"/></svg>
              推流分辨率
            </span>
            <span class="val"><span id="resSelectorLabel">1080P · 30fps</span><span class="chev">⌄</span></span>
          </button>
        </div>

        <div class="field" data-od-id="password-field">
          <label for="pwd">推流密码（可选，留空则公开）</label>
          <div class="inputwrap">
            <input id="pwd" type="password" inputmode="text" autocomplete="off" placeholder="输入自定义密码" />
            <button class="eye" id="pwdEye" type="button" aria-label="显示密码">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg>
            </button>
          </div>
          <p class="field-hint" id="pwdHint">密码会写入 RTSP 与 WebRTC 链接</p>
        </div>

        <button class="btn btn-primary" id="startBtn" type="button" data-od-id="start-stream">开始推流</button>
      </div>

      <div id="liveControls" hidden>
        <div class="sig-card" data-od-id="rtsp-push-signal">
          <div class="sig-top">
            <span class="proto"><span class="ptag">RTSP</span>推流地址</span>
            <button class="copy-btn" data-copy="push" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <span>复制</span>
            </button>
          </div>
          <div class="url mono" id="pushUrl">rtsp://192.168.1.23:8554/live/cam0</div>
        </div>

        <div class="sig-card" data-od-id="rtsp-signal">
          <div class="sig-top">
            <span class="proto"><span class="ptag">RTSP</span>拉流地址</span>
            <button class="copy-btn" data-copy="rtsp" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <span>复制</span>
            </button>
          </div>
          <div class="url mono" id="rtspUrl">rtsp://192.168.1.23:8554/live/cam0</div>
        </div>

        <div class="sig-card" data-od-id="webrtc-signal">
          <div class="sig-top">
            <span class="proto"><span class="ptag">WebRTC</span>播放地址</span>
            <button class="copy-btn" data-copy="webrtc" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <span>复制</span>
            </button>
          </div>
          <div class="url mono" id="webrtcUrl">wss://192.168.1.23:8443/rtc/cam0</div>
        </div>

        <div class="auth-note" id="authNote">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <span id="authText">公开推流 · 未设置密码</span>
        </div>

        <button class="btn btn-danger" id="stopBtn" type="button" data-od-id="stop-stream">停止推流</button>
      </div>
    </section>
  </div>
</div>

<!-- 分辨率选择 sheet -->
<div class="scrim" id="resScrim"></div>
<div class="sheet" id="resSheet" role="dialog" aria-modal="true" aria-label="选择分辨率">
  <div class="grab"></div>
  <h2>选择推流分辨率</h2>
  <p class="sheet-sub" id="resSheetSub">当前镜头：后置</p>
  <div class="res-list" id="resList"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  var RES = {
    rear: [
      { w: 1920, h: 1080, label: "1080P", fps: 30 },
      { w: 1280, h: 720, label: "720P", fps: 30 },
      { w: 640, h: 480, label: "VGA", fps: 30 }
    ],
    front: [
      { w: 1920, h: 1080, label: "1080P", fps: 30 },
      { w: 1280, h: 720, label: "720P", fps: 30 }
    ]
  };

  var state = {
    camera: "rear",
    res: RES.rear[0],
    password: "",
    streaming: false,
    timerId: null,
    startedAt: 0
  };

  function resText(r) { return r.label + " · " + r.fps + "fps"; }

  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._t);
    t._t = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }

  function copy(text, btn) {
    function done() {
      if (btn) {
        btn.classList.add("copied");
        btn.querySelector("span").textContent = "已复制";
        setTimeout(function () {
          btn.classList.remove("copied");
          btn.querySelector("span").textContent = "复制";
        }, 1600);
      }
      toast("已复制到剪贴板");
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text); done(); });
    } else {
      legacyCopy(text); done();
    }
  }
  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }

  function buildSignals() {
    var host = "192.168.1.23", cam = "cam0", pwd = state.password;
    var base = "rtsp://" + host + ":8554/live/" + cam;
    if (pwd) {
      return {
        push: "rtsp://admin:" + pwd + "@" + host + ":8554/live/" + cam,
        rtsp: "rtsp://admin:" + pwd + "@" + host + ":8554/live/" + cam,
        webrtc: "wss://" + host + ":8443/rtc/" + cam + "?token=" + pwd
      };
    }
    return {
      push: base,
      rtsp: base,
      webrtc: "wss://" + host + ":8443/rtc/" + cam
    };
  }

  function renderBadges() {
    $("camBadge").textContent = state.camera === "rear" ? "后置 · 广角" : "前置 · 自拍";
    $("camSwitchLabel").textContent = state.camera === "rear" ? "后置" : "前置";
    $("resBadge").textContent = resText(state.res);
    $("resSelectorLabel").textContent = resText(state.res);
    $("scene").classList.toggle("front", state.camera === "front");
  }

  function displayUrls() {
    var s = buildSignals(), pwd = state.password;
    $("pushUrl").textContent = pwd ? "rtsp://admin:••••@192.168.1.23:8554/live/cam0" : s.push;
    $("rtspUrl").textContent = pwd ? "rtsp://admin:••••@192.168.1.23:8554/live/cam0" : s.rtsp;
    $("webrtcUrl").textContent = pwd ? "wss://192.168.1.23:8443/rtc/cam0?token=••••" : s.webrtc;
    $("authText").textContent = pwd ? "鉴权已启用 · 密码 " + pwd : "公开推流 · 未设置密码";
  }

  function switchCamera() {
    if (state.streaming) return;
    state.camera = state.camera === "rear" ? "front" : "rear";
    var list = RES[state.camera];
    var found = list.some(function (r) { return r.w === state.res.w && r.h === state.res.h; });
    if (!found) state.res = list[0];
    renderBadges();
    renderResSheet();
    toast(state.camera === "rear" ? "已切换至后置镜头" : "已切换至前置镜头");
  }

  function renderResSheet() {
    var list = RES[state.camera];
    $("resSheetSub").textContent = "当前镜头：" + (state.camera === "rear" ? "后置" : "前置");
    var html = "";
    list.forEach(function (r, i) {
      var sel = r.w === state.res.w && r.h === state.res.h;
      html +=
        '<button class="res-item' + (sel ? " selected" : "") + '" type="button" data-i="' + i + '">' +
          '<span class="ri-main">' +
            '<span class="ri-res">' + r.w + "×" + r.h + " · " + r.label + "</span>" +
            '<span class="ri-meta">' + r.fps + " fps</span>" +
          "</span>" +
          '<span class="ri-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="12" height="12"><path d="M5 12l5 5 9-10"/></svg></span>' +
        "</button>";
    });
    $("resList").innerHTML = html;
  }
  function openResSheet() {
    if (state.streaming) return;
    renderResSheet();
    $("resSheet").classList.add("open");
    $("resScrim").classList.add("open");
  }
  function closeResSheet() {
    $("resSheet").classList.remove("open");
    $("resScrim").classList.remove("open");
  }

  function startStream() {
    state.password = $("pwd").value;
    var btn = $("startBtn");
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>正在建立推流…';

    setTimeout(function () {
      state.streaming = true;
      state.startedAt = Date.now();

      $("preControls").hidden = true;
      $("liveControls").hidden = false;
      $("livePill").hidden = false;

      displayUrls();
      $("timer").textContent = "00:00:00";

      state.timerId = setInterval(function () {
        var d = Math.floor((Date.now() - state.startedAt) / 1000);
        var h = String(Math.floor(d / 3600)).padStart(2, "0");
        var m = String(Math.floor((d % 3600) / 60)).padStart(2, "0");
        var s = String(d % 60).padStart(2, "0");
        $("timer").textContent = h + ":" + m + ":" + s;
      }, 1000);

      btn.disabled = false;
      btn.innerHTML = "开始推流";
      toast("推流成功 · RTSP 与 WebRTC 已生成");
    }, 900);
  }

  function stopStream() {
    clearInterval(state.timerId);
    state.streaming = false;
    $("liveControls").hidden = true;
    $("preControls").hidden = false;
    $("livePill").hidden = true;
    toast("已停止推流");
  }

  function tickClock() {
    var n = new Date();
    $("clock").textContent = String(n.getHours()).padStart(2, "0") + ":" + String(n.getMinutes()).padStart(2, "0");
  }

  function bind() {
    $("camSwitch").addEventListener("click", switchCamera);
    $("resSelector").addEventListener("click", openResSheet);
    $("resScrim").addEventListener("click", closeResSheet);
    $("resList").addEventListener("click", function (e) {
      var item = e.target.closest(".res-item");
      if (!item) return;
      state.res = RES[state.camera][parseInt(item.getAttribute("data-i"), 10)];
      renderBadges();
      closeResSheet();
    });

    $("pwdEye").addEventListener("click", function () {
      $("pwd").type = $("pwd").type === "password" ? "text" : "password";
    });

    $("startBtn").addEventListener("click", startStream);
    $("stopBtn").addEventListener("click", stopStream);

    document.querySelectorAll("[data-copy]").forEach(function (b) {
      b.addEventListener("click", function () {
        var s = buildSignals();
        var key = b.getAttribute("data-copy");
        copy(key === "rtsp" ? s.rtsp : key === "webrtc" ? s.webrtc : s.push, b);
      });
    });
  }

  function init() {
    tickClock();
    setInterval(tickClock, 30000);
    renderBadges();
    renderResSheet();
    bind();
  }
  init();
})();
</script>
</body>
</html>
